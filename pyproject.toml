[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recdb"
version = "0.2.0"
description = "A sqlite3-compatible DB-API adapter for GNU recfiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "mofosyne", email = "mofosyne@gmail.com" },
]
keywords = ["recfile", "recutils", "database", "sqlite", "db-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlparse>=0.4",
]

[project.optional-dependencies]
recutils = [
    "python-recutils>=0.1",
]
dev = [
    "pytest>=7",
    "python-recutils>=0.1",
]

[project.urls]
Repository = "https://github.com/mofosyne/recdb"
"Bug Tracker" = "https://github.com/mofosyne/recdb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
